id: token-bucket-cap
title: TokenBucket refills past its capacity
difficulty: medium
tags:
- rate-limiting
- time
instruction: |
  `throttle.TokenBucket` is supposed to allow bursts of at most `capacity` requests. After the
  bucket has been idle for a while it allows far more:

  ```python
  bucket = TokenBucket(capacity=5, refill_rate=1.0, clock=fake_clock)
  # ... drain it, then let 100 seconds pass ...
  sum(bucket.try_acquire() for _ in range(50))   # 50, expected 5
  ```

  The token count must never exceed `capacity`. Refill speed while below capacity should not
  change.
