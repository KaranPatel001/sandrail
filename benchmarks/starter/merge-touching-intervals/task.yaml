id: merge-touching-intervals
title: merge_intervals leaves touching intervals apart
difficulty: easy
tags:
- algorithms
instruction: |
  `spans.merge_intervals` treats intervals as closed (`[start, end]`), so intervals that share
  an endpoint overlap and should be merged. They currently are not:

  ```python
  >>> merge_intervals([(1, 2), (2, 3)])
  [(1, 2), (2, 3)]      # expected [(1, 3)]
  ```

  Overlapping, unsorted and nested inputs should all produce a sorted list of disjoint
  intervals.
