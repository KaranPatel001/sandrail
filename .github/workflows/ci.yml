name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Validate starter tasks
        run: sandrail validate --tasks benchmarks/starter
      - name: Reference and cheating baselines
        run: |
          sandrail run --model scripted:reference --out results/reference
          sandrail run --model scripted:cheat --out results/cheat
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-reports
          path: results/*/report.md
