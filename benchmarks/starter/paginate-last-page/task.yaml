id: paginate-last-page
title: paginate drops the last partial page
difficulty: easy
tags:
- off-by-one
instruction: |
  `pager.paginate` loses items when the list length is not a multiple of `per_page`.

  ```python
  >>> paginate(list(range(25)), page=3, per_page=10)
  ValueError: page 3 out of range 1..2
  ```

  25 items at 10 per page should give 3 pages, the last holding 5 items. An empty list should
  still have exactly one (empty) page. `has_next` / `has_prev` should be consistent with
  `total_pages`.
